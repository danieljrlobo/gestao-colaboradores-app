<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Colaboradores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 50; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 0.5rem; max-width: 90%; width: 600px; transform: scale(0.95); transition: transform 0.3s ease; }
        .modal-overlay.is-open .modal-content { transform: scale(1); }
        .period-btn.active { background-color: #2563eb; color: white; }
        .input-field { width: 100%; padding: 0.5rem 0.75rem; background-color: white; border: 1px solid #d1d5db; border-radius: 0.375rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .input-field:focus { outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div style="border-top-color:transparent" class="w-16 h-16 border-4 border-blue-400 border-solid rounded-full animate-spin"></div>
        <h2 class="text-center text-xl font-semibold mt-4">Carregando...</h2>
    </div>

    <div id="app" class="hidden">
        <header class="bg-white shadow-md">
            <div class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Gestão de Colaboradores</h1>
                <div>
                    <button id="import-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">Importar JSON</button>
                    <button id="export-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300 ml-2">Exportar JSON</button>
                </div>
            </div>
        </header>

        <nav class="bg-gray-800 text-white">
            <div class="container mx-auto px-6">
                <div class="flex items-center justify-center space-x-4">
                    <button data-view="strategies" class="nav-link py-4 px-2 text-gray-300 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Estratégias</button>
                    <button data-view="collaborators" class="nav-link py-4 px-2 text-gray-300 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Colaboradores</button>
                    <button data-view="leaders" class="nav-link py-4 px-2 text-gray-300 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Líderes</button>
                    <button data-view="feedbacks" class="nav-link py-4 px-2 text-gray-300 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Feedbacks</button>
                    <button data-view="analysis" class="nav-link py-4 px-2 text-gray-300 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Análises</button>
                </div>
            </div>
        </nav>

        <main id="main-content" class="container mx-auto p-6"></main>
    </div>

    <div id="generic-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold"></h3>
                <button id="modal-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module">
        const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
        const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
        const { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, writeBatch } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        class LocalDB extends Dexie { constructor() { super("GestaoColaboradoresDB"); this.version(1).stores({ collaborators: '++id,&matricula,leaderId,turno', leaders: '++id,&matricula,turno', strategies: '++id,status', feedbacks: '++id,leaderId,employeeId,date' }); } }
        const db = new LocalDB();

        class AppService {
            constructor(firebaseConfig) { this.fbApp = initializeApp(firebaseConfig); this.fbAuth = getAuth(this.fbApp); this.fbStore = getFirestore(this.fbApp); this.init(); }
            async init() { try { await this.signIn(); this.setupRealtimeListeners(); this.hideLoadingOverlay(); } catch (error) { console.error("Erro na inicialização:", error); alert("Não foi possível conectar ao serviço."); } }
            async signIn() { return new Promise((resolve, reject) => { onAuthStateChanged(this.fbAuth, user => { if (user) { resolve(user); } else { signInAnonymously(this.fbAuth).then(resolve).catch(reject); } }); }); }
            setupRealtimeListeners() { ['strategies', 'collaborators', 'leaders', 'feedbacks'].forEach(colName => { onSnapshot(collection(this.fbStore, colName), (querySnapshot) => { if (querySnapshot.docChanges().length === 0) return; const promises = querySnapshot.docChanges().map(change => { const docData = { id: change.doc.id, ...change.doc.data() }; if (change.type === "added" || change.type === "modified") return db[colName].put(docData); if (change.type === "removed") return db[colName].delete(docData.id); }); Promise.all(promises); }); }); }
            hideLoadingOverlay() { document.getElementById('loading-overlay').style.display = 'none'; document.getElementById('app').classList.remove('hidden'); }
            async addStrategy(d) { return await addDoc(collection(this.fbStore, 'strategies'), d); }
            async updateStrategy(id, d) { return await updateDoc(doc(this.fbStore, 'strategies', id), d); }
            async deleteStrategy(id) { return await deleteDoc(doc(this.fbStore, 'strategies', id)); }
            async addCollaborator(d) { return await addDoc(collection(this.fbStore, 'collaborators'), d); }
            async updateCollaborator(id, d) { return await updateDoc(doc(this.fbStore, 'collaborators', id), d); }
            async deleteCollaborator(id) { return await deleteDoc(doc(this.fbStore, 'collaborators', id)); }
            async addLeader(d) { return await addDoc(collection(this.fbStore, 'leaders'), d); }
            async updateLeader(id, d) { return await updateDoc(doc(this.fbStore, 'leaders', id), d); }
            async deleteLeader(id) { return await deleteDoc(doc(this.fbStore, 'leaders', id)); }
            async addFeedback(d) { return await addDoc(collection(this.fbStore, 'feedbacks'), d); }
            async exportData() { const data = { strategies: await db.strategies.toArray(), collaborators: await db.collaborators.toArray(), leaders: await db.leaders.toArray(), feedbacks: await db.feedbacks.toArray() }; for (const key in data) { data[key].forEach(item => delete item.id); } const jsonString = JSON.stringify(data, null, 2); const blob = new Blob([jsonString], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `gestao_colaboradores_backup_${new Date().toISOString().split('T')[0]}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); }
            async importData(jsonData) { try { const data = JSON.parse(jsonData); const batch = writeBatch(this.fbStore); for (const colName in data) { if (data.hasOwnProperty(colName)) { const collectionRef = collection(this.fbStore, colName); for (const docData of data[colName]) { batch.set(doc(collectionRef), docData); } } } await batch.commit(); alert('Dados importados com sucesso!'); } catch (error) { console.error("Erro ao importar dados:", error); alert("Falha na importação."); } }
        }

        class StrategiesView { constructor() { this.draggedItem = null; } async render(container) { container.innerHTML = this.getTemplate(); const strategies = await db.strategies.toArray(); this.renderCards(strategies); this.attachEventListeners(); } getTemplate() { return ` <div class="flex justify-between items-center mb-6"><h2 class="text-3xl font-bold text-gray-800">Quadro de Estratégias</h2><button id="add-strategy-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">+ Nova Estratégia</button></div> <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kanban-board"> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="planejada"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-yellow-500 pb-2">Planejadas</h3><div class="space-y-4 min-h-[200px]" data-container="planejada"></div></div> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="em andamento"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-blue-500 pb-2">Em Andamento</h3><div class="space-y-4 min-h-[200px]" data-container="em andamento"></div></div> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="concluída"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-green-500 pb-2">Concluídas</h3><div class="space-y-4 min-h-[200px]" data-container="concluída"></div></div> </div> `; } renderCards(strategies) { document.querySelectorAll('[data-container]').forEach(c => c.innerHTML = ''); strategies.forEach(strategy => { const container = document.querySelector(`[data-container="${strategy.status}"]`); if (container) { const card = this.createCardElement(strategy); container.appendChild(card); } }); } createCardElement(strategy) { const card = document.createElement('div'); card.className = 'bg-white p-4 rounded-lg shadow-md cursor-grab transition-shadow hover:shadow-xl'; card.draggable = true; card.dataset.id = strategy.id; card.innerHTML = ` <h4 class="font-bold text-md mb-2">${strategy.title}</h4> <p class="text-gray-600 text-sm">${strategy.description}</p> <div class="text-right mt-4"> <button class="edit-strategy-btn text-blue-500 hover:text-blue-700 text-sm font-semibold" data-id="${strategy.id}">Editar</button> <button class="delete-strategy-btn text-red-500 hover:text-red-700 text-sm font-semibold ml-2" data-id="${strategy.id}">Excluir</button> </div> `; return card; } attachEventListeners() { document.getElementById('add-strategy-btn').addEventListener('click', () => this.handleAdd()); document.querySelectorAll('.edit-strategy-btn').forEach(btn => { btn.addEventListener('click', async (e) => { const strategy = await db.strategies.get(e.target.dataset.id); this.handleEdit(strategy); }); }); document.querySelectorAll('.delete-strategy-btn').forEach(btn => { btn.addEventListener('click', (e) => this.handleDelete(e.target.dataset.id)); }); this.setupDragAndDrop(); } handleAdd() { const form = this.createFormElement(); window.modalService.open({ title: 'Nova Estratégia', body: form }); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const data = { title: formData.get('title'), description: formData.get('description'), status: 'planejada' }; await window.appService.addStrategy(data); window.modalService.close(); }; } handleEdit(strategy) { const form = this.createFormElement(strategy); window.modalService.open({ title: 'Editar Estratégia', body: form }); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const updatedData = { title: formData.get('title'), description: formData.get('description') }; await window.appService.updateStrategy(strategy.id, updatedData); window.modalService.close(); }; } handleDelete(id) { window.modalService.confirm({ title: 'Excluir Estratégia', message: 'Tem certeza que deseja excluir esta estratégia? Esta ação não pode ser desfeita.', onConfirm: () => window.appService.deleteStrategy(id) }); } createFormElement(strategy = {}) { const form = document.createElement('form'); form.innerHTML = ` <div class="space-y-4"> <div><label class="block text-sm font-medium">Título</label><input type="text" name="title" value="${strategy.title || ''}" class="input-field" required></div> <div><label class="block text-sm font-medium">Descrição</label><textarea name="description" rows="4" class="input-field" required>${strategy.description || ''}</textarea></div> <div class="text-right"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button></div> </div> `; return form; } setupDragAndDrop() { const cards = document.querySelectorAll('[draggable="true"]'); const columns = document.querySelectorAll('.kanban-column'); cards.forEach(card => { card.addEventListener('dragstart', (e) => { this.draggedItem = e.target; setTimeout(() => e.target.style.opacity = '0.5', 0); }); card.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; this.draggedItem = null; }); }); columns.forEach(column => { column.addEventListener('dragover', (e) => e.preventDefault()); column.addEventListener('drop', (e) => { e.preventDefault(); if (this.draggedItem) { const targetColumn = e.currentTarget; const newStatus = targetColumn.dataset.status; const cardId = this.draggedItem.dataset.id; targetColumn.querySelector('[data-container]').appendChild(this.draggedItem); window.appService.updateStrategy(cardId, { status: newStatus }); } }); }); } }
        class CollaboratorsView { constructor() { this.selectedCollaboratorId = null; this.filter = 'todos'; this.performanceChart = null; } async render(container) { container.innerHTML = this.getTemplate(); await this.renderCollaboratorList(); if (this.selectedCollaboratorId) { await this.renderCollaboratorDetails(this.selectedCollaboratorId); } else { this.renderPlaceholderDetails(); } this.attachEventListeners(); } getTemplate() { return ` <div class="flex justify-between items-center mb-6"> <h2 class="text-3xl font-bold text-gray-800">Colaboradores</h2> <div class="flex items-center space-x-4"> <div class="flex items-center space-x-2"> <label for="turno-filter" class="text-sm font-medium text-gray-700">Filtrar por Turno:</label> <select id="turno-filter" class="rounded-md border-gray-300 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50"> <option value="todos">Todos</option><option value="Manhã">Manhã</option><option value="Tarde">Tarde</option><option value="Noite">Noite</option> </select> </div> <button id="add-collaborator-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">+ Novo Colaborador</button> </div> </div> <div class="grid grid-cols-1 md:grid-cols-3 gap-6"> <div class="md:col-span-1 bg-white p-4 rounded-lg shadow"><div id="collaborator-list" class="space-y-3 h-[75vh] overflow-y-auto"></div></div> <div class="md:col-span-2 bg-white p-6 rounded-lg shadow"><div id="collaborator-details" class="h-[75vh] overflow-y-auto"></div></div> </div> `; } async renderCollaboratorList() { const listContainer = document.getElementById('collaborator-list'); let collaborators = await db.collaborators.orderBy('name').toArray(); if (this.filter !== 'todos') { collaborators = collaborators.filter(c => c.turno === this.filter); } listContainer.innerHTML = collaborators.length === 0 ? `<p class="text-gray-500 text-center p-4">Nenhum colaborador encontrado.</p>` : collaborators.map(collab => { const isSelected = collab.id === this.selectedCollaboratorId; return ` <div class="flex items-center p-3 rounded-lg cursor-pointer ${isSelected ? 'bg-blue-100' : 'hover:bg-gray-100'} transition-colors collaborator-item" data-id="${collab.id}"> <img src="${collab.photoUrl || 'https://i.pravatar.cc/40?u=' + collab.matricula}" alt="Foto de ${collab.name}" class="w-10 h-10 rounded-full mr-4"> <div><p class="font-semibold text-gray-800">${collab.name}</p><p class="text-sm text-gray-600">${collab.role}</p></div> </div> `}).join(''); document.querySelectorAll('.collaborator-item').forEach(item => { item.addEventListener('click', (e) => { this.selectedCollaboratorId = e.currentTarget.dataset.id; this.render(document.getElementById('main-content')); }); }); } async renderCollaboratorDetails(id) { const detailsContainer = document.getElementById('collaborator-details'); const collab = await db.collaborators.get(id); if (!collab) { this.renderPlaceholderDetails(); return; } const renderSkills = (skills) => skills && skills.length > 0 ? skills.map(s => `<li class="flex justify-between"><span>${s.name}</span> <span class="font-medium">${s.level}/10</span></li>`).join('') : '<li>Nenhuma registrada.</li>'; const renderActionPlan = (plan) => plan && plan.length > 0 ? plan.map(p => `<li class="flex justify-between items-center"><span>${p.action}</span> <span class="text-xs font-semibold px-2 py-1 rounded-full ${p.status === 'concluído' ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800'}">${p.status}</span></li>`).join('') : '<li>Nenhum plano de ação.</li>'; detailsContainer.innerHTML = ` <div class="flex flex-col h-full"> <div class="flex items-start justify-between mb-6"> <div class="flex items-center"> <img src="${collab.photoUrl || 'https://i.pravatar.cc/80?u=' + collab.matricula}" alt="Foto de ${collab.name}" class="w-20 h-20 rounded-full mr-6 border-4 border-gray-200"> <div> <h3 class="text-2xl font-bold text-gray-900">${collab.name}</h3> <p class="text-md text-gray-600">${collab.role}</p> <p class="text-sm text-gray-500">Matrícula: ${collab.matricula} | Turno: ${collab.turno}</p> </div> </div> <div> <button id="add-performance-btn" class="text-green-600 hover:text-green-800 font-semibold mr-4">Add Performance</button> <button id="edit-collaborator-btn" class="text-blue-600 hover:text-blue-800 font-semibold">Editar</button> <button id="delete-collaborator-btn" class="text-red-600 hover:text-red-800 font-semibold ml-4">Excluir</button> </div> </div> <div class="flex-grow overflow-y-auto pr-2"> <div class="grid grid-cols-1 lg:grid-cols-2 gap-6"> <div class="lg:col-span-2 bg-gray-50 p-4 rounded-lg"><h4 class="font-bold text-lg mb-2">Histórico de Performance</h4><canvas id="performance-chart"></canvas></div> <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">C.H.A.</h4><ul class="text-sm space-y-2"><li><strong>Conhecimento:</strong> ${collab.cha?.conhecimento || 'N/A'}</li><li><strong>Habilidade:</strong> ${collab.cha?.habilidade || 'N/A'}</li><li><strong>Atitude:</strong> ${collab.cha?.atitude || 'N/A'}</li></ul></div> <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Plano de Ação</h4><ul class="text-sm space-y-2">${renderActionPlan(collab.actionPlan)}</ul></div> <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Hard Skills</h4><ul class="text-sm space-y-1">${renderSkills(collab.skills?.hard)}</ul></div> <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Soft Skills</h4><ul class="text-sm space-y-1">${renderSkills(collab.skills?.soft)}</ul></div> </div> </div> </div> `; this.renderPerformanceChart(collab.performanceHistory); document.getElementById('add-performance-btn').addEventListener('click', () => this.openPerformanceModal(collab)); document.getElementById('edit-collaborator-btn').addEventListener('click', () => this.handleAddOrEdit(collab)); document.getElementById('delete-collaborator-btn').addEventListener('click', () => this.handleDelete(collab.id)); } renderPlaceholderDetails() { document.getElementById('collaborator-details').innerHTML = ` <div class="flex flex-col items-center justify-center h-full text-center text-gray-500"> <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg> <h3 class="mt-2 text-sm font-medium text-gray-900">Selecione um colaborador</h3> <p class="mt-1 text-sm text-gray-500">Clique em um colaborador na lista para ver os detalhes ou adicione um novo.</p> </div>`; } renderPerformanceChart(history = []) { const ctx = document.getElementById('performance-chart')?.getContext('2d'); if (!ctx) return; const labels = history.map(p => new Date(p.date).toLocaleDateString()); const data = history.map(p => p.score); if (this.performanceChart) { this.performanceChart.destroy(); } this.performanceChart = new Chart(ctx, { type: 'line', data: { labels, datasets: [{ label: 'Score de Performance', data, borderColor: '#3b82f6', tension: 0.1, fill: false }] }, options: { scales: { y: { beginAtZero: true, max: 10 } } } }); } attachEventListeners() { document.getElementById('turno-filter').addEventListener('change', (e) => { this.filter = e.target.value; this.render(document.getElementById('main-content')); }); document.getElementById('add-collaborator-btn').addEventListener('click', () => this.handleAddOrEdit()); } handleAddOrEdit(collab = null) { const form = this.createFormElement(collab); window.modalService.open({ title: collab ? 'Editar Colaborador' : 'Novo Colaborador', body: form, }); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const data = { name: formData.get('name'), matricula: formData.get('matricula'), role: formData.get('role'), turno: formData.get('turno'), photoUrl: formData.get('photoUrl'), leaderId: formData.get('leaderId'), cha: { conhecimento: formData.get('cha_conhecimento'), habilidade: formData.get('cha_habilidade'), atitude: formData.get('cha_atitude'), }, skills: collab?.skills || { hard: [], soft: [] }, actionPlan: collab?.actionPlan || [], performanceHistory: collab?.performanceHistory || [] }; if (collab) { await window.appService.updateCollaborator(collab.id, data); } else { await window.appService.addCollaborator(data); } window.modalService.close(); }; } handleDelete(id) { window.modalService.confirm({ title: 'Excluir Colaborador', message: 'Tem certeza que deseja excluir este colaborador? Esta ação não pode ser desfeita.', onConfirm: () => { window.appService.deleteCollaborator(id); if (id === this.selectedCollaboratorId) { this.selectedCollaboratorId = null; } } }); } openPerformanceModal(collab) { const form = document.createElement('form'); form.innerHTML = ` <div class="space-y-4"> <div><label class="block text-sm font-medium">Data</label><input type="date" name="date" class="input-field w-full" required></div> <div><label class="block text-sm font-medium">Score (0-10)</label><input type="number" name="score" min="0" max="10" step="0.1" class="input-field w-full" required></div> <div class="text-right mt-4"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button></div> </div> `; window.modalService.open({ title: `Adicionar Performance para ${collab.name}`, body: form }); form.onsubmit = async (e) => { e.preventDefault(); const newPerformance = { date: new Date(form.elements.date.value).getTime(), score: parseFloat(form.elements.score.value) }; const updatedHistory = [...(collab.performanceHistory || []), newPerformance]; await window.appService.updateCollaborator(collab.id, { performanceHistory: updatedHistory }); window.modalService.close(); }; } createFormElement(collab = {}) { const form = document.createElement('form'); const cha = collab.cha || {}; form.innerHTML = ` <div class="space-y-4 max-h-[7                 setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; document.getElementById('app').classList.remove('hidden'); }, 100);
                window.uiController = new UIController('main-content', '.nav-link');
                window.modalService = new ModalService();
                document.getElementById('export-btn').onclick = () => alert("Funcionalidade indisponível sem Firebase.");
                document.getElementById('import-btn').onclick = () => alert("Funcionalidade indisponível sem Firebase.");
            } else {
                window.appService = new AppService(firebaseConfig);
                window.uiController = new UIController('main-content', '.nav-link');
                window.modalService = new ModalService();
                document.getElementById('export-btn').addEventListener('click', () => window.appService.exportData());
                const fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = '.json'; fileInput.style.display = 'none';
                fileInput.onchange = (e) => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (event) => window.appService.importData(event.target.result); reader.readAsText(file); } };
                document.body.appendChild(fileInput);
                document.getElementById('import-btn').addEventListener('click', () => { if (confirm('Atenção: A importação adicionará novos registros. Deseja continuar?')) fileInput.click(); });
            }
        });
    </script>
</body>
</html>
