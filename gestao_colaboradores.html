<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Gestão e Desenvolvimento</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <script src="https://unpkg.com/dexie@3/dist/dexie.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode/html5-qrcode.min.js"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 50; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease; }
        .modal-overlay.is-open { opacity: 1; visibility: visible; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 0.5rem; max-width: 90%; width: 600px; transform: scale(0.95); transition: transform 0.3s ease; }
        .modal-overlay.is-open .modal-content { transform: scale(1); }
        .period-btn.active { background-color: #2563eb; color: white; }
        .input-field { width: 100%; padding: 0.5rem 0.75rem; background-color: white; border: 1px solid #d1d5db; border-radius: 0.375rem; box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .input-field:focus { outline: none; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.5); border-color: #3b82f6; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <div id="loading-overlay" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center">
        <div style="border-top-color:transparent" class="w-16 h-16 border-4 border-blue-400 border-solid rounded-full animate-spin"></div>
        <h2 class="text-center text-xl font-semibold mt-4">Carregando...</h2>
    </div>

    <div id="app" class="hidden">
        <header class="bg-white shadow-md">
            <div class="container mx-auto px-6 py-4">
                <h1 class="text-3xl font-bold text-gray-800">Painel de Gestão e Desenvolvimento</h1>
                <p class="text-sm text-gray-600 mt-1">Ferramenta para acompanhar e desenvolver a equipe.</p>
            </div>
        </header>

        <nav class="bg-gray-800 text-white">
            <div class="container mx-auto px-6 flex justify-between items-center">
                <div class="flex items-center space-x-4">
                    <button data-view="dashboard" class="nav-link py-4 px-3 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Visão da Liderança</button>
                    <button data-view="strategies" class="nav-link py-4 px-3 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Estratégias</button>
                    <button data-view="team" class="nav-link py-4 px-3 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Equipe</button>
                    <button data-view="feedbacks" class="nav-link py-4 px-3 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Feedbacks</button>
                    <button data-view="analysis" class="nav-link py-4 px-3 font-medium border-b-4 border-transparent hover:border-blue-500 hover:text-white transition">Análises</button>
                </div>
                <div>
                    <button id="import-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300">Importar JSON</button>
                    <button id="export-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition duration-300 ml-2">Exportar JSON</button>
                </div>
            </div>
        </nav>

        <main id="main-content" class="container mx-auto p-6"></main>
    </div>

    <div id="generic-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title" class="text-xl font-bold"></h3>
                <button id="modal-close-btn" class="text-gray-500 hover:text-gray-800 text-2xl leading-none">&times;</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
    window.addEventListener('load', () => {

        class LocalDB extends Dexie {
            constructor() {
                super("GestaoEquipeDB");
                this.version(1).stores({
                    collaborators: '++id, &matricula, name, role, turno, leaderId, status',
                    leaders: '++id, &matricula, name, role, turno, status',
                    strategies: '++id, status',
                    feedbacks: '++id, leaderId, employeeId, date'
                });
            }
        }
        const db = new LocalDB();

        class DBService {
            async add(tableName, data) { return await db[tableName].add(data); }
            async update(tableName, id, data) { return await db[tableName].update(id, data); }
            async delete(tableName, id) { return await db[tableName].delete(id); }
            async getAll(tableName) { return await db[tableName].toArray(); }
            async getById(tableName, id) { return await db[tableName].get(id); }

            async addStrategy(d) { return await this.add('strategies', d); }
            async updateStrategy(id, d) { return await this.update('strategies', id, d); }
            async deleteStrategy(id) { return await this.delete('strategies', id); }

            async addCollaborator(d) { return await this.add('collaborators', d); }
            async updateCollaborator(id, d) {
                const oldData = await this.getById('collaborators', id);
                if (d.actionPlan && oldData) {
                    d.actionPlan.forEach((newPlan, index) => {
                        const oldPlan = oldData.actionPlan ? oldData.actionPlan[index] : undefined;
                        if (newPlan.status === 'Concluído' && oldPlan?.status !== 'Concluído') {
                            d.performanceHistory = d.performanceHistory || [];
                            d.performanceHistory.push({ score: 3, date: new Date(), reason: `Plano de Ação Concluído: ${newPlan.action}` });
                        }
                    });
                }
                return await this.update('collaborators', id, d);
            }
            async deleteCollaborator(id) { return await this.delete('collaborators', id); }

            async addLeader(d) { return await this.add('leaders', d); }
            async updateLeader(id, d) { return await this.update('leaders', id, d); }
            async deleteLeader(id) { return await this.delete('leaders', id); }

            async addFeedback(d) {
                const rating = d.rating;
                let score = 0;
                if (rating >= 4) score = 2;
                else if (rating === 3) score = 1;
                else if (rating <= 2) score = -1;

                if (score !== 0) {
                    const leader = await this.getById('leaders', d.leaderId);
                    if (leader) {
                        const performanceHistory = leader.performanceHistory || [];
                        performanceHistory.push({ score: score, date: new Date(d.date), reason: `Feedback de ${d.rating} estrelas` });
                        await this.updateLeader(d.leaderId, { performanceHistory });
                    }
                }
                return await this.add('feedbacks', d);
            }
            async updateFeedback(id, data) { return await this.update('feedbacks', id, data); }
            async deleteFeedback(id) { return await this.delete('feedbacks', id); }

            async exportData() {
                const data = {
                    strategies: await this.getAll('strategies'),
                    collaborators: await this.getAll('collaborators'),
                    leaders: await this.getAll('leaders'),
                    feedbacks: await this.getAll('feedbacks'),
                };
                for (const key in data) {
                    data[key].forEach(item => delete item.id);
                }
                const jsonString = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `gestao_equipe_backup_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }

            async importData(jsonData) {
                try {
                    const data = JSON.parse(jsonData);
                    for (const tableName in data) {
                        if (db.hasOwnProperty(tableName)) {
                            const table = db[tableName];
                            for (const record of data[tableName]) {
                                if (record.matricula) {
                                    const existing = await table.where('matricula').equals(record.matricula).first();
                                    if (!existing) {
                                        await table.add(record);
                                    } else {
                                        console.warn(`Registro com matrícula ${record.matricula} já existe em ${tableName}. Ignorando.`);
                                    }
                                } else {
                                     await table.add(record);
                                }
                            }
                        }
                    }
                    alert('Dados importados com sucesso! A página será recarregada.');
                    location.reload();
                } catch (error) {
                    console.error("Erro ao importar dados:", error);
                    alert("Falha na importação. Verifique o console para mais detalhes.");
                }
            }
        }

        class ModalService {
            constructor() {
                this.modalElement = document.getElementById('generic-modal');
                this.titleElement = document.getElementById('modal-title');
                this.bodyElement = document.getElementById('modal-body');
                document.getElementById('modal-close-btn').addEventListener('click', () => this.close());
                this.modalElement.addEventListener('click', (e) => { if (e.target === this.modalElement) this.close(); });
            }
            open({ title, body }) {
                this.titleElement.textContent = title;
                this.bodyElement.innerHTML = '';
                this.bodyElement.appendChild(body);
                this.modalElement.classList.add('is-open');
            }
            close() {
                this.modalElement.classList.remove('is-open');
            }
            confirm({ title, message, onConfirm }) {
                const confirmationBody = document.createElement('div');
                confirmationBody.innerHTML = `
                    <p class="mb-6">${message}</p>
                    <div class="flex justify-end space-x-4">
                        <button id="confirm-cancel-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded-lg">Cancelar</button>
                        <button id="confirm-action-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Confirmar</button>
                    </div>
                `;
                this.open({ title, body: confirmationBody });
                confirmationBody.querySelector('#confirm-cancel-btn').onclick = () => this.close();
                confirmationBody.querySelector('#confirm-action-btn').onclick = () => {
                    onConfirm();
                    this.close();
                };
            }
        }

        class DashboardView {
            async render(container) {
                container.innerHTML = this.getTemplate();
                await this.populateKanban();
                this.attachEventListeners();
            }

            getTemplate() {
                return `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                            <div class="bg-blue-100 p-4 rounded-full mr-4"><svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></div>
                            <div><h3 class="text-gray-500 text-sm font-medium">Desenvolvimento da Equipe</h3><p class="text-2xl font-bold text-gray-800">75%</p></div>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                            <div class="bg-green-100 p-4 rounded-full mr-4"><svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg></div>
                            <div><h3 class="text-gray-500 text-sm font-medium">Metodologias Aplicadas</h3><p class="text-2xl font-bold text-gray-800">5</p></div>
                        </div>
                        <div class="bg-white p-6 rounded-lg shadow-md flex items-center">
                             <div class="bg-red-100 p-4 rounded-full mr-4"><svg class="w-8 h-8 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6"></path></svg></div>
                            <div><h3 class="text-gray-500 text-sm font-medium">Queda de Absenteísmo</h3><p class="text-2xl font-bold text-gray-800">-15%</p></div>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="dashboard-kanban">
                        <div class="bg-green-100 rounded-lg p-4 kanban-column" data-status="destaque"><h3 class="font-bold text-lg mb-4 text-green-800 border-b-2 border-green-500 pb-2">Colaboradores Destaques</h3><div class="space-y-4 min-h-[200px]" data-container="destaque"></div></div>
                        <div class="bg-blue-100 rounded-lg p-4 kanban-column" data-status="evolucao"><h3 class="font-bold text-lg mb-4 text-blue-800 border-b-2 border-blue-500 pb-2">Em Evolução</h3><div class="space-y-4 min-h-[200px]" data-container="evolucao"></div></div>
                        <div class="bg-red-100 rounded-lg p-4 kanban-column" data-status="atencao"><h3 class="font-bold text-lg mb-4 text-red-800 border-b-2 border-red-500 pb-2">Ponto de Atenção</h3><div class="space-y-4 min-h-[200px]" data-container="atencao"></div></div>
                    </div>
                `;
            }

            async populateKanban() {
                const collaborators = await window.dbService.getAll('collaborators');
                const leaders = await window.dbService.getAll('leaders');
                const allPersonnel = [...collaborators, ...leaders];

                allPersonnel.forEach(person => {
                    const status = person.status || 'evolucao';
                    const container = document.querySelector(`#dashboard-kanban [data-container="${status}"]`);
                    if (container) {
                        container.appendChild(this.createKanbanCard(person));
                    }
                });
            }

            createKanbanCard(person) {
                const card = document.createElement('div');
                card.className = 'bg-white p-4 rounded-lg shadow-md cursor-pointer hover:shadow-xl transition-shadow';
                card.dataset.id = person.id;
                card.dataset.type = person.hasOwnProperty('leaderId') ? 'collaborator' : 'leader';

                card.innerHTML = `
                    <div class="flex items-center">
                        <img src="${person.photoUrl || 'https://i.pravatar.cc/40?u=' + person.matricula}" alt="Foto de ${person.name}" class="w-10 h-10 rounded-full mr-4">
                        <div>
                            <p class="font-semibold text-gray-800">${person.name}</p>
                            <p class="text-sm text-gray-600">${person.role}</p>
                        </div>
                    </div>
                `;
                return card;
            }

            attachEventListeners() {
                document.querySelectorAll('#dashboard-kanban .cursor-pointer').forEach(card => {
                    card.addEventListener('click', (e) => {
                        const id = e.currentTarget.dataset.id;
                        const type = e.currentTarget.dataset.type;
                        window.uiController.currentView = 'team';
                        window.uiController.renderCurrentView({ selected_id: id, selected_type: type });
                    });
                });
            }
        }

        class StrategiesView { constructor() { this.draggedItem = null; } async render(container) { container.innerHTML = this.getTemplate(); const strategies = await window.dbService.getAll('strategies'); this.renderCards(strategies); this.attachEventListeners(); } getTemplate() { return ` <div class="flex justify-between items-center mb-6"><h2 class="text-3xl font-bold text-gray-800">Quadro de Estratégias</h2><button id="add-strategy-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md transition-transform transform hover:scale-105">+ Nova Estratégia</button></div> <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="kanban-board"> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="planejada"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-yellow-500 pb-2">Planejadas</h3><div class="space-y-4 min-h-[200px]" data-container="planejada"></div></div> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="em andamento"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-blue-500 pb-2">Em Andamento</h3><div class="space-y-4 min-h-[200px]" data-container="em andamento"></div></div> <div class="bg-gray-200 rounded-lg p-4 kanban-column" data-status="concluída"><h3 class="font-bold text-lg mb-4 text-gray-700 border-b-2 border-green-500 pb-2">Concluídas</h3><div class="space-y-4 min-h-[200px]" data-container="concluída"></div></div> </div> `; } renderCards(strategies) { document.querySelectorAll('[data-container]').forEach(c => c.innerHTML = ''); strategies.forEach(strategy => { const container = document.querySelector(`[data-container="${strategy.status}"]`); if (container) { const card = this.createCardElement(strategy); container.appendChild(card); } }); } createCardElement(strategy) { const card = document.createElement('div'); card.className = 'bg-white p-4 rounded-lg shadow-md cursor-grab transition-shadow hover:shadow-xl'; card.draggable = true; card.dataset.id = strategy.id; card.innerHTML = ` <h4 class="font-bold text-md mb-2">${strategy.title}</h4> <p class="text-gray-600 text-sm">${strategy.description}</p> <div class="text-right mt-4"> <button class="edit-strategy-btn text-blue-500 hover:text-blue-700 text-sm font-semibold" data-id="${strategy.id}">Editar</button> <button class="delete-strategy-btn text-red-500 hover:text-red-700 text-sm font-semibold ml-2" data-id="${strategy.id}">Excluir</button> </div> `; return card; } attachEventListeners() { document.getElementById('add-strategy-btn').addEventListener('click', () => this.handleAdd()); document.querySelectorAll('.edit-strategy-btn').forEach(btn => { btn.addEventListener('click', async (e) => { const strategy = await window.dbService.getById('strategies', parseInt(e.target.dataset.id)); this.handleEdit(strategy); }); }); document.querySelectorAll('.delete-strategy-btn').forEach(btn => { btn.addEventListener('click', (e) => this.handleDelete(parseInt(e.target.dataset.id))); }); this.setupDragAndDrop(); } handleAdd() { const form = this.createFormElement(); window.modalService.open({ title: 'Nova Estratégia', body: form }); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const data = { title: formData.get('title'), description: formData.get('description'), status: 'planejada' }; await window.dbService.addStrategy(data); window.modalService.close(); }; } handleEdit(strategy) { const form = this.createFormElement(strategy); window.modalService.open({ title: 'Editar Estratégia', body: form }); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const updatedData = { title: formData.get('title'), description: formData.get('description') }; await window.dbService.updateStrategy(strategy.id, updatedData); window.modalService.close(); }; } handleDelete(id) { window.modalService.confirm({ title: 'Excluir Estratégia', message: 'Tem certeza que deseja excluir esta estratégia? Esta ação não pode ser desfeita.', onConfirm: () => window.dbService.deleteStrategy(id) }); } createFormElement(strategy = {}) { const form = document.createElement('form'); form.innerHTML = ` <div class="space-y-4"> <div><label class="block text-sm font-medium">Título</label><input type="text" name="title" value="${strategy.title || ''}" class="input-field" required></div> <div><label class="block text-sm font-medium">Descrição</label><textarea name="description" rows="4" class="input-field" required>${strategy.description || ''}</textarea></div> <div class="text-right"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button></div> </div> `; return form; } setupDragAndDrop() { const cards = document.querySelectorAll('[draggable="true"]'); const columns = document.querySelectorAll('.kanban-column'); cards.forEach(card => { card.addEventListener('dragstart', (e) => { this.draggedItem = e.target; setTimeout(() => e.target.style.opacity = '0.5', 0); }); card.addEventListener('dragend', (e) => { e.target.style.opacity = '1'; this.draggedItem = null; }); }); columns.forEach(column => { column.addEventListener('dragover', (e) => e.preventDefault()); column.addEventListener('drop', (e) => { e.preventDefault(); if (this.draggedItem) { const targetColumn = e.currentTarget; const newStatus = targetColumn.dataset.status; const cardId = parseInt(this.draggedItem.dataset.id); targetColumn.querySelector('[data-container]').appendChild(this.draggedItem); window.dbService.updateStrategy(cardId, { status: newStatus }); } }); }); } }

        class TeamView {
            constructor() {
                this.selectedPersonId = null;
                this.selectedPersonType = null;
                this.performanceChart = null;
            }

            async render(container, params = {}) {
                if (params.selected_id) {
                    this.selectedPersonId = parseInt(params.selected_id);
                    this.selectedPersonType = params.selected_type;
                }

                container.innerHTML = this.getTemplate();
                await this.renderAllLists();

                if (this.selectedPersonId) {
                    await this.renderPersonDetails(this.selectedPersonId, this.selectedPersonType);
                } else {
                    this.renderPlaceholderDetails();
                }
                this.attachEventListeners();
            }

            getTemplate() {
                return `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-gray-800">Equipe</h2>
                        <button id="add-person-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-md">+ Adicionar Pessoa</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div id="team-lists-container" class="md:col-span-1 bg-white p-4 rounded-lg shadow space-y-4 h-[80vh] overflow-y-auto"></div>
                        <div id="person-details" class="md:col-span-2 bg-white p-6 rounded-lg shadow h-[80vh] overflow-y-auto"></div>
                    </div>
                `;
            }

            async renderAllLists() {
                const container = document.getElementById('team-lists-container');
                container.innerHTML = '';

                const leaders = await window.dbService.getAll('leaders');
                const collaborators = await window.dbService.getAll('collaborators');

                const roles = {
                    "Liderança": "Líder",
                    "Gerência": "Gerente",
                    "Supervisão": "Supervisor",
                    "Administrador": "Administrador",
                    "Colaboradores": "Colaborador"
                };

                const renderListForRole = (title, people, isCollaboratorList = false) => {
                    const listId = `${title.toLowerCase().replace(' ', '-')}-list`;
                    let listHtml = `<div class="mb-4"><h3 class="font-bold text-lg text-gray-700 pb-2 border-b">${title}</h3><div id="${listId}" class="space-y-2 pt-2">`;

                    const peopleInRole = people.filter(p => isCollaboratorList ? true : p.role === roles[title]);

                    if (peopleInRole.length > 0) {
                        listHtml += peopleInRole.map(person => {
                            const type = isCollaboratorList ? 'collaborator' : 'leader';
                            const isSelected = person.id === this.selectedPersonId && type === this.selectedPersonType;
                            return `
                                <div class="flex items-center p-2 rounded-lg cursor-pointer ${isSelected ? 'bg-blue-100' : 'hover:bg-gray-100'} person-item" data-id="${person.id}" data-type="${type}">
                                    <img src="${person.photoUrl || 'https://i.pravatar.cc/40?u=' + person.matricula}" alt="Foto de ${person.name}" class="w-10 h-10 rounded-full mr-3">
                                    <div>
                                        <p class="font-semibold text-gray-800">${person.name || 'Nome Inválido'}</p>
                                        <p class="text-sm text-gray-600">${person.role}</p>
                                    </div>
                                </div>`;
                        }).join('');
                    } else {
                        listHtml += `<p class="text-sm text-gray-400 px-2">Nenhum registro.</p>`;
                    }
                    listHtml += `</div></div>`;
                    return listHtml;
                };

                container.innerHTML += renderListForRole("Liderança", leaders);

                container.innerHTML += renderListForRole("Administrador", leaders);

                document.querySelectorAll('.person-item').forEach(item => {

            async renderPersonDetails(id, type) {
                 const detailsContainer = document.getElementById('person-details');

                    const promotionMap = { "Líder": "Supervisor", "Supervisor": "Gerente", "Gerente": "Administrador" };
                    if (promotionMap[currentRole]) {
                        return `<button id="promote-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-1 px-3 rounded text-sm">Promover a ${promotionMap[currentRole]}</button>`;
                    }
                    return '';
                };
                 const getDemotionButton = () => {
                    if (type === 'leader') return `<button id="demote-btn" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-1 px-3 rounded text-sm ml-2">Rebaixar a Colaborador</button>`;
                    return '';
                 };

                detailsContainer.innerHTML = `
                    <div class="flex flex-col h-full">
                        <div class="flex items-start justify-between mb-4">
                             <div class="flex items-center">
                                <img src="${person.photoUrl || 'https://i.pravatar.cc/80?u=' + person.matricula}" alt="Foto de ${person.name}" class="w-20 h-20 rounded-full mr-6 border-4 border-gray-200">
                                <div>
                                    <h3 class="text-2xl font-bold text-gray-900">${person.name}</h3>
                                    <p class="text-md text-gray-600">${person.role}</p>
                                    <p class="text-sm text-gray-500">Matrícula: ${person.matricula} | Turno: ${person.turno}</p>
                                </div>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                ${getPromotionButton()}
                                ${getDemotionButton()}
                                <button id="edit-person-btn" class="text-blue-600 hover:text-blue-800 font-semibold">Editar</button>
                                <button id="delete-person-btn" class="text-red-600 hover:text-red-800 font-semibold">Excluir</button>
                            </div>
                        </div>
                        <div class="flex-grow overflow-y-auto pr-2 space-y-4">
                             <div class="bg-gray-50 p-4 rounded-lg">
                                <div class="flex justify-between items-center mb-2">
                                    <h4 class="font-bold text-lg">${type === 'leader' ? 'Pontuação de Liderança' : 'Histórico de Performance'}</h4>
                                    <button id="manage-performance-btn" class="text-xs bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1 px-3 rounded-full">Gerenciar</button>
                                </div>
                                <canvas id="performance-chart"></canvas>
                            </div>
                            <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                                <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">C.H.A.</h4><ul class="text-sm space-y-2"><li><strong>Conhecimento:</strong> ${person.cha?.conhecimento || 'N/A'}</li><li><strong>Habilidade:</strong> ${person.cha?.habilidade || 'N/A'}</li><li><strong>Atitude:</strong> ${person.cha?.atitude || 'N/A'}</li></ul></div>
                                <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Plano de Ação</h4><ul class="text-sm space-y-2">${this.renderActionPlan(person.actionPlan)}</ul></div>
                                <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Hard Skills</h4><ul class="text-sm space-y-1">${this.renderSkillsAndAverage(person.skills?.hard, 'Hard Skills')}</div>
                                <div class="bg-gray-50 p-4 rounded-lg"><h4 class="font-bold mb-2">Soft Skills</h4><ul class="text-sm space-y-1">${this.renderSkillsAndAverage(person.skills?.soft, 'Soft Skills')}</div>
                            </div>
                        </div>
                    </div>
                `;

                this.renderPerformanceChart(person, type);
                this.attachDetailEventListeners(person, type);
            }

            renderPlaceholderDetails(message = "Clique em uma pessoa na lista para ver os detalhes ou adicione um novo.") {
                 document.getElementById('person-details').innerHTML = `
                     <div class="flex flex-col items-center justify-center h-full text-center text-gray-500">
                         <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                         <h3 class="mt-2 text-sm font-medium text-gray-900">Selecione uma pessoa</h3>
                         <p class="mt-1 text-sm text-gray-500">${message}</p>
                     </div>`;
            }

            renderPerformanceChart(person, type) {
                const ctx = document.getElementById('performance-chart')?.getContext('2d');
                if (!ctx) return;

                const history = person.performanceHistory || [];
                if (this.performanceChart) this.performanceChart.destroy();

                if (type === 'collaborator') {
                    this.performanceChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: history.map(p => new Date(p.date).toLocaleDateString()),
                            datasets: [{ label: 'Score Individual', data: history.map(p => p.score), backgroundColor: '#3b82f6' }]
                        },
                        options: { scales: { y: { beginAtZero: true } } }
                    });
                } else {
                    const cumulativeData = history.reduce((acc, p) => {
                        const score = (acc.length > 0 ? acc[acc.length - 1].y : 0) + p.score;
                        acc.push({ x: new Date(p.date).getTime(), y: score });
                        return acc;
                    }, []);
                    this.performanceChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            datasets: [{ label: 'Evolução da Pontuação', data: cumulativeData, borderColor: '#3b82f6', tension: 0.1 }]
                        },
                        options: { scales: { x: { type: 'time', time: { unit: 'day' } } } }
                    });
                }
            }

            attachEventListeners() {
                const addBtn = document.getElementById('add-person-btn');
                if(addBtn) addBtn.addEventListener('click', () => this.handleEditOrAdd());
            }

            attachDetailEventListeners(person, type){
                const promoteBtn = document.getElementById('promote-btn');
                if (promoteBtn) promoteBtn.addEventListener('click', () => this.handlePromote(person, type));

                const demoteBtn = document.getElementById('demote-btn');
                if (demoteBtn) demoteBtn.addEventListener('click', () => this.handleDemote(person));

                const managePerfBtn = document.getElementById('manage-performance-btn');
                if (managePerfBtn) managePerfBtn.addEventListener('click', () => this.openPerformanceManagementModal(person, type));
            }

            renderSkillsAndAverage(skills = [], categoryName) {
                if (!skills || skills.length === 0) {
                    return '<li>Nenhuma registrada.</li>';
                }
                const total = skills.reduce((acc, s) => acc + (s.level || 0), 0);
                const average = (total / skills.length).toFixed(1);
                const skillsHtml = skills.map(s => `<li class="flex justify-between"><span>${s.name}</span> <span class="font-medium">${s.level}/10 ★</span></li>`).join('');
                const averageHtml = `<p class="text-right font-bold mt-2 text-sm text-gray-600">Média de ${categoryName}: ${average} / 10</p>`;
                return `${skillsHtml}</ul><div class="border-t mt-2 pt-2">${averageHtml}</div>`;
            }

            renderActionPlan(plan = []) {
                return plan.length > 0 ? plan.map(p => `<li class="flex justify-between items-center"><span>${p.action}</span><span class="text-xs font-semibold px-2 py-1 rounded-full ${p.status === 'Concluído' ? 'bg-green-200 text-green-800' : 'bg-yellow-200 text-yellow-800'}">${p.status}</span></li>`).join('') : '<li>Nenhum plano de ação.</li>';
            }

            openPerformanceManagementModal(person, type) {
                const modalBody = document.createElement('div');
                const history = person.performanceHistory || [];

                let recordsHtml = history.length > 0
                    ? history.map((record, index) => `
                        <li class="flex justify-between items-center p-2 bg-gray-100 rounded">
                            <span>Score: <strong>${record.score}</strong> em ${new Date(record.date).toLocaleDateString()}</span>
                            <button class="delete-record-btn text-red-500 hover:text-red-700 text-xs" data-index="${index}">Excluir</button>
                        </li>`).join('')
                    : '<p class="text-gray-500">Nenhum registro de performance encontrado.</p>';

                modalBody.innerHTML = `
                    <h4 class="font-bold mb-4">Gerenciar Histórico</h4>
                    <ul class="space-y-2 mb-6">${recordsHtml}</ul>
                    <div class="text-right border-t pt-4">
                        <button id="clear-history-btn" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-lg">Zerar Histórico Completo</button>
                    </div>
                `;

                window.modalService.open({ title: `Gerenciar Performance de ${person.name}`, body: modalBody });

                modalBody.querySelectorAll('.delete-record-btn').forEach(button => {
                    button.addEventListener('click', async (e) => {
                        const index = parseInt(e.target.dataset.index);
                        const newHistory = person.performanceHistory.filter((_, i) => i !== index);
                        await window.dbService.update(type === 'leader' ? 'leaders' : 'collaborators', person.id, { performanceHistory: newHistory });
                        window.modalService.close();
                        this.render(document.getElementById('main-content'));
                    });
                });

                modalBody.querySelector('#clear-history-btn').addEventListener('click', () => {
                     window.modalService.confirm({
                        title: 'Zerar Histórico?',
                        message: `Tem certeza que deseja apagar todo o histórico de performance de ${person.name}? Esta ação não pode ser desfeita.`,
                        onConfirm: async () => {
                            await window.dbService.update(type === 'leader' ? 'leaders' : 'collaborators', person.id, { performanceHistory: [] });
                            window.modalService.close();
                            this.render(document.getElementById('main-content'));
                        }
                    });
                });
            }

            async handlePromote(person, type) {
                if (type === 'collaborator') {
                    await window.dbService.delete('collaborators', person.id);
                    delete person.id;
                    await window.dbService.add('leaders', {...person, role: 'Líder'});
                } else {
                    const promotionMap = { "Líder": "Supervisor", "Supervisor": "Gerente", "Gerente": "Administrador" };
                    const newRole = promotionMap[person.role];
                    if(newRole) {
                        await window.dbService.update('leaders', person.id, { role: newRole });
                    }
                }
                this.selectedPersonType = 'leader';
                this.render(document.getElementById('main-content'));
            }

            async handleDemote(person) {
                await window.dbService.delete('leaders', person.id);
                delete person.id;
                await window.dbService.add('collaborators', {...person, role: 'Colaborador', leaderId: null});

                const formerCollaborators = await db.collaborators.where('leaderId').equals(person.id).toArray();
                for(const collab of formerCollaborators) {
                    await window.dbService.update('collaborators', collab.id, { leaderId: null });
                }

                this.selectedPersonId = null;
                this.render(document.getElementById('main-content'));
            }

            handleEditOrAdd(person = null, type = 'collaborator') {
                const isEditing = person !== null;
                const modalTitle = isEditing ? `Editar ${person.name}` : 'Adicionar Nova Pessoa';
                const form = document.createElement('form');
                form.className = 'space-y-4';

                const currentRole = isEditing ? person.role : 'Colaborador';
                const roleOptions = {
                    'Colaborador': ['Colaborador'],
                    'Líder': ['Líder', 'Supervisor', 'Gerente', 'Administrador']
                };

                const isLeaderType = type === 'leader' || (isEditing && roleOptions['Líder'].includes(person.role));

                form.innerHTML = `
                    <div><label class="block text-sm font-medium">Nome Completo</label><input type="text" name="name" class="input-field" value="${person?.name || ''}" required></div>
                    <div><label class="block text-sm font-medium">Matrícula</label><input type="text" name="matricula" class="input-field" value="${person?.matricula || ''}" ${isEditing ? 'readonly' : 'required'}></div>
                    <div><label class="block text-sm font-medium">Cargo</label><select name="role" class="input-field">${(isLeaderType ? roleOptions['Líder'] : roleOptions['Colaborador']).map(r => `<option value="${r}" ${currentRole === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
                    <div><label class="block text-sm font-medium">Turno</label><input type="text" name="turno" class="input-field" value="${person?.turno || ''}"></div>
                    <div><label class="block text-sm font-medium">URL da Foto</label><input type="text" name="photoUrl" class="input-field" value="${person?.photoUrl || ''}"></div>
                    <div class="text-right"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">${isEditing ? 'Salvar Alterações' : 'Adicionar Pessoa'}</button></div>
                `;

                window.modalService.open({ title: modalTitle, body: form });

                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const formData = new FormData(form);
                    const data = {
                        name: formData.get('name'),
                        matricula: formData.get('matricula'),
                        role: formData.get('role'),
                        turno: formData.get('turno'),
                        photoUrl: formData.get('photoUrl'),
                        status: person?.status || 'evolucao',
                    };

                    const targetRoleType = roleOptions['Líder'].includes(data.role) ? 'leader' : 'collaborator';

                    if (isEditing) {
                        const originalType = type;
                        if (originalType === targetRoleType) {
                            await window.dbService.update(originalType === 'leader' ? 'leaders' : 'collaborators', person.id, data);
                        } else {
                            await window.dbService.delete(originalType === 'leader' ? 'leaders' : 'collaborators', person.id);
                            delete person.id;
                            await window.dbService.add(targetRoleType === 'leader' ? 'leaders' : 'collaborators', {...person, ...data});
                        }
                    } else {
                        await window.dbService.add(targetRoleType === 'leader' ? 'leaders' : 'collaborators', data);
                    }

                    window.modalService.close();
                    this.render(document.getElementById('main-content'));
                };
            }
        }

        class FeedbacksView {
            constructor() { this.COOLDOWN_DAYS = 15; }
            async render(container) {
                const leaders = await window.dbService.getAll('leaders');
                const feedbacks = await window.dbService.getAll('feedbacks');
                container.innerHTML = this.getTemplate(leaders, feedbacks);
                this.attachEventListeners(feedbacks);
            }
            getTemplate(leaders, feedbacks) {
                return `
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-gray-800">Feedbacks Recebidos</h2>

                    </div>
                `;
            }
            getLeaderFeedbackTemplate(leader, allFeedbacks) {
                const leaderFeedbacks = allFeedbacks.filter(f => f.leaderId === leader.id).sort((a, b) => b.date - a.date);
                const averageRating = leaderFeedbacks.length > 0 ? (leaderFeedbacks.reduce((acc, f) => acc + f.rating, 0) / leaderFeedbacks.length).toFixed(1) : 'N/A';
                return `
                    <div class="bg-white rounded-lg shadow-lg p-6">
                        <div class="flex items-center mb-4">
                            <img src="${leader.photoUrl || 'https://i.pravatar.cc/60?u=' + leader.matricula}" alt="${leader.name}" class="w-16 h-16 rounded-full mr-4">
                            <div>
                                <h3 class="text-xl font-bold">${leader.name}</h3>
                                <p class="text-gray-600">Média de Avaliação: <span class="font-bold text-blue-600">${averageRating} ★</span></p>
                            </div>
                        </div>
                        <div class="max-h-60 overflow-y-auto space-y-3 pr-2">
                            ${leaderFeedbacks.length > 0 ? leaderFeedbacks.map(f => `
                                <div class="bg-gray-50 p-3 rounded-md border-l-4 border-gray-200">
                                    <div class="flex justify-between items-start">
                                        <div>
                                            <div class="flex items-center text-sm mb-1">
                                                <span class="font-semibold text-yellow-500">${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}</span>
                                                <span class="text-gray-500 ml-2">${new Date(f.date).toLocaleDateString()}</span>
                                            </div>
                                            <p class="text-gray-700">${f.text}</p>
                                        </div>
                                        <div class="flex-shrink-0 ml-4">
                                            <button class="edit-feedback-btn text-blue-500 hover:text-blue-700 text-xs font-semibold" data-id="${f.id}">Editar</button>
                                            <button class="delete-feedback-btn text-red-500 hover:text-red-700 text-xs font-semibold ml-2" data-id="${f.id}">Apagar</button>
                                        </div>
                                    </div>
                                </div>
                            `).join('') : '<p class="text-sm text-gray-500">Nenhum feedback recebido.</p>'}
                        </div>
                    </div>
                `;
            }
            attachEventListeners(feedbacks) {
                document.getElementById('send-feedback-btn').addEventListener('click', () => this.openFeedbackModal());

                document.querySelectorAll('.edit-feedback-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const feedback = feedbacks.find(f => f.id === parseInt(e.target.dataset.id));
                        this.openEditFeedbackModal(feedback);
                    });
                });

                document.querySelectorAll('.delete-feedback-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        this.handleDelete(parseInt(e.target.dataset.id));
                    });
                });
            }

            openEditFeedbackModal(feedback) {
                const form = document.createElement('form');
                form.innerHTML = `
                    <div class="space-y-4">
                        <div><label class="block text-sm font-medium">Comentário</label><textarea name="text" rows="4" class="input-field" required>${feedback.text}</textarea></div>
                        <div class="text-right"><button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg">Salvar</button></div>
                    </div>
                `;
                window.modalService.open({ title: 'Editar Feedback', body: form });
                form.onsubmit = async (e) => {
                    e.preventDefault();
                    const updatedText = new FormData(form).get('text');
                    await window.dbService.updateFeedback(feedback.id, { text: updatedText });
                    window.modalService.close();
                };
            }

            handleDelete(id) {
                window.modalService.confirm({
                    title: 'Apagar Feedback',
                    message: 'Tem certeza que deseja apagar este feedback? Esta ação não pode ser desfeita.',
                    onConfirm: () => window.dbService.deleteFeedback(id)
                });
            }

            async openFeedbackModal() { const leaders = await window.dbService.getAll('leaders'); const modalBody = document.createElement('div'); modalBody.innerHTML = ` <form id="feedback-form" class="space-y-4"> <div><label class="block text-sm font-medium">Selecione o Líder</label><select name="leaderId" class="input-field w-full" required><option value="">-- Escolha um líder --</option>${leaders.map(l => `<option value="${l.id}">${l.name}</option>`).join('')}</select></div> <div><label class="block text-sm font-medium">Sua Matrícula</label><div class="flex items-center"><input type="text" name="employeeId" class="input-field flex-grow" required><button type="button" id="scan-qr-btn" class="ml-2 mt-1 p-2 bg-gray-600 text-white rounded-lg hover:bg-gray-700"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg></button></div><div id="qr-reader" class="mt-2" style="width:100%"></div></div> <div><label class="block text-sm font-medium">Avaliação</label><div id="star-rating" class="flex items-center text-3xl cursor-pointer text-gray-300">${[...Array(5)].map((_, i) => `<span class="star" data-value="${i + 1}">&#9734;</span>`).join('')}</div><input type="hidden" name="rating" required></div> <div><label class="block text-sm font-medium">Comentário</label><textarea name="text" rows="4" class="input-field w-full" required></textarea></div> <div class="text-right mt-6"><button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-lg">Enviar</button></div> </form> `; window.modalService.open({ title: 'Enviar Feedback', body: modalBody }); this.setupFeedbackFormListeners(); } setupFeedbackFormListeners() { const form = document.getElementById('feedback-form'); const stars = document.querySelectorAll('.star'); const ratingInput = form.elements.rating; stars.forEach(star => { star.addEventListener('click', (e) => { const value = e.target.dataset.value; ratingInput.value = value; stars.forEach(s => { s.innerHTML = s.dataset.value <= value ? '&#9733;' : '&#9734;'; s.style.color = s.dataset.value <= value ? 'orange' : 'lightgray'; }); }); }); document.getElementById('scan-qr-btn').addEventListener('click', () => this.startScanner()); form.onsubmit = async (e) => { e.preventDefault(); const formData = new FormData(form); const leaderId = parseInt(formData.get('leaderId')); const employeeId = formData.get('employeeId'); const lastFeedback = await db.feedbacks.where({ leaderId, employeeId }).last(); if (lastFeedback) { const daysSinceLast = (Date.now() - lastFeedback.date) / (1000 * 60 * 60 * 24); if (daysSinceLast < this.COOLDOWN_DAYS) { const body = document.createElement('div'); body.innerText = `Você já avaliou este líder nos últimos ${this.COOLDOWN_DAYS} dias. Por favor, aguarde.`; window.modalService.open({title: "Cooldown", body: body }); return; } } const data = { leaderId, employeeId, rating: parseInt(ratingInput.value), text: formData.get('text'), date: Date.now() }; await window.dbService.addFeedback(data); window.modalService.close(); }; } startScanner() { const qrReaderElement = document.getElementById('qr-reader'); qrReaderElement.style.display = 'block'; const html5QrCode = new Html5Qrcode("qr-reader"); const qrCodeSuccessCallback = (decodedText, decodedResult) => { document.querySelector('[name="employeeId"]').value = decodedText; html5QrCode.stop().then(() => { qrReaderElement.style.display = 'none'; }); }; const config = { fps: 10, qrbox: { width: 250, height: 250 } }; html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback); } }

        class AnalysisView { constructor() { this.periodInDays = 30; this.chart = null; } async render(container) { container.innerHTML = this.getTemplate(); await this.renderData(); this.attachEventListeners(); } getTemplate() { return ` <div class="flex justify-between items-center mb-6"><h2 class="text-3xl font-bold text-gray-800">Análise de Performance</h2><div id="analysis-period-filter" class="flex items-center space-x-2"><button data-period="7" class="period-btn">7 dias</button><button data-period="15" class="period-btn">15 dias</button><button data-period="30" class="period-btn active">30 dias</button><button data-period="365" class="period-btn">Último Ano</button></div></div> <div class="bg-white rounded-lg shadow-lg p-6 mb-6"><canvas id="comparative-performance-chart"></canvas></div> <div class="bg-white rounded-lg shadow-lg p-6"><h3 class="text-xl font-bold mb-4">Ranking de Performance</h3><ul id="performance-ranking-list" class="space-y-3"></ul></div> `; } async renderData() { const cutoffDate = Date.now() - this.periodInDays * 24 * 60 * 60 * 1000; const collaborators = await window.dbService.getAll('collaborators'); const leaders = await window.dbService.getAll('leaders'); const allPersonnel = [...collaborators.map(c => ({...c, type: 'Colaborador'})), ...leaders.map(l => ({...l, type: 'Líder', leaderId: l.id }))]; const performanceData = allPersonnel.map(person => { const recentPerformances = (person.performanceHistory || []).filter(p => p.date >= cutoffDate); const averageScore = recentPerformances.length > 0 ? recentPerformances.reduce((acc, p) => acc + p.score, 0) / recentPerformances.length : 0; return { ...person, averageScore }; }).filter(p => p.averageScore > 0).sort((a, b) => b.averageScore - a.averageScore); this.renderChart(performanceData, leaders); this.renderRankingList(performanceData); } renderChart(data, leaders) { const ctx = document.getElementById('comparative-performance-chart')?.getContext('2d'); if (!ctx) return; const leaderColors = leaders.reduce((acc, leader, index) => { acc[leader.id] = `hsl(${index * 60}, 70%, 60%)`; return acc; }, {}); if (this.chart) this.chart.destroy(); this.chart = new Chart(ctx, { type: 'bar', data: { labels: data.map(p => p.name), datasets: [{ label: `Média (Últimos ${this.periodInDays} dias)`, data: data.map(p => p.averageScore.toFixed(2)), backgroundColor: data.map(p => leaderColors[p.leaderId] || '#9ca3af'), }] }, options: { indexAxis: 'y', scales: { x: { beginAtZero: true, max: 10 } }, plugins: { legend: { display: false } } } }); } renderRankingList(data) { const listContainer = document.getElementById('performance-ranking-list'); listContainer.innerHTML = data.length === 0 ? '<p class="text-center text-gray-500">Nenhum dado no período.</p>' : data.map((person, index) => ` <li class="flex items-center p-3 bg-gray-50 rounded-lg"><span class="font-bold text-lg text-gray-500 w-8">${index + 1}</span><img src="${person.photoUrl || 'https://i.pravatar.cc/40?u=' + person.matricula}" alt="${person.name}" class="w-10 h-10 rounded-full mr-4"><div><p class="font-semibold text-gray-800">${person.name}</p><p class="text-sm text-gray-600">${person.role}</p></div><span class="ml-auto text-lg font-bold text-blue-600">${person.averageScore.toFixed(2)}</span></li> `).join(''); } attachEventListeners() { document.querySelectorAll('.period-btn').forEach(btn => { btn.addEventListener('click', (e) => { this.periodInDays = parseInt(e.target.dataset.period); document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active')); e.target.classList.add('active'); this.renderData(); }); btn.classList.add('px-3', 'py-1', 'rounded-md', 'text-sm', 'font-medium', 'transition-colors'); if (!btn.classList.contains('active')) { btn.classList.add('bg-gray-200', 'text-gray-700', 'hover:bg-gray-300'); } else { btn.classList.add('bg-blue-600', 'text-white'); } }); } }

        class UIController {
            constructor(mainContentId, navSelector) {
                this.mainContent = document.getElementById(mainContentId);
                this.navLinks = document.querySelectorAll(navSelector);
                this.currentView = 'dashboard';
                this.viewInstances = {
                    dashboard: new DashboardView(),
                    strategies: new StrategiesView(),
                    team: new TeamView(),
                    feedbacks: new FeedbacksView(),
                    analysis: new AnalysisView()
                };
                this.initNavEvents();
                this.renderCurrentView();
            }

            initNavEvents() {
                this.navLinks.forEach(link => {
                    link.addEventListener('click', (e) => {
                        const view = e.target.dataset.view;
                        if (view && this.viewInstances[view]) {
                            this.currentView = view;
                            this.renderCurrentView();
                        }
                    });
                });
                db.on('changes', () => {
                    if (this.viewInstances[this.currentView]) {
                        this.viewInstances[this.currentView].render(this.mainContent);
                    }
                });
            }

            updateNavStyles() {
                this.navLinks.forEach(link => {
                    const isActive = link.dataset.view === this.currentView;
                    link.classList.toggle('border-blue-500', isActive);
                    link.classList.toggle('text-white', isActive);
                    link.classList.toggle('border-transparent', !isActive);
                    link.classList.toggle('text-gray-300', !isActive);
                });
            }

            renderCurrentView(params = {}) {
                this.updateNavStyles();
                const viewInstance = this.viewInstances[this.currentView];
                if (viewInstance) {
                    viewInstance.render(this.mainContent, params);
                } else {
                    this.mainContent.innerHTML = `<h2>Página não encontrada</h2>`;
                }
                const firstChild = this.mainContent.firstChild;
                if (firstChild && firstChild.nodeType === 1) { // Check if it's an element
                    firstChild.classList.add('fade-in');
                }
            }
        }

        window.dbService = new DBService();
        window.modalService = new ModalService();
        window.uiController = new UIController('main-content', '.nav-link');

        document.getElementById('export-btn').addEventListener('click', () => window.dbService.exportData());

        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = '.json';
        fileInput.style.display = 'none';
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => window.dbService.importData(event.target.result);
                reader.readAsText(file);
            }
        };
        document.body.appendChild(fileInput);
        document.getElementById('import-btn').addEventListener('click', () => {
            if (confirm('Atenção: A importação irá ignorar registros com matrículas duplicadas. Deseja continuar?')) {
                fileInput.click();
            }
        });

        document.getElementById('loading-overlay').style.display = 'none';
        document.getElementById('app').classList.remove('hidden');

    });
    </script>
</body>
